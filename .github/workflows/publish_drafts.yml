name: Publish draft releases

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-drafts:
    runs-on: ubuntu-22.04
    steps:
      - name: Publish all drafts and ensure v1.3.2 is latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in v1.1.0 v1.1.1 v1.2.0 v1.2.1 v1.2.2 v1.3.0; do
            echo "Publishing $tag..."
            gh release edit "$tag" --draft=false || echo "Skipping $tag"
          done
          echo "Setting v1.3.2 as latest..."
          gh release edit "v1.3.2" --latest
